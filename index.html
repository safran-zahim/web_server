<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Homepage</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header */
        header {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        /* Navigation */
        nav {
            background-color: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #f4f4f4;
            text-decoration: underline;
        }

        /* Main Content */
        main {
            padding: 20px;
            text-align: center;
        }

        main h2 {
            margin-bottom: 20px;
        }

        main p {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Webserver Project</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="about.html">About</a>
    </nav>

    <main>
        <h2>home</h2>
        <p>
            <img src="img.png" alt="">
        </p>
    </main>

    <footer>
        <p>&copy; All rights reserved.</p>
    </footer>

</body>
</html>
